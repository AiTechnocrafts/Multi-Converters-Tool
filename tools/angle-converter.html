<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Angle Converter - Convert between degrees, radians, and gradians.">
    <meta name="keywords" content="angle converter, unit converter, degrees, radians, gradians, conversion tool">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Angle Converter - Multi-Tools Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Angle Converter</h1>
                        
                        <!-- Ad Section Placeholder (Top of Tool) -->
                        <div class="ad-placeholder mb-4">
                            <p>Advertisement Area (Tool Page Top)</p>
                            <script type="text/javascript">
	atOptions = {
		'key' : '0d73d6b662ce5f6514511d545d49e26f',
		'format' : 'iframe',
		'height' : 50,
		'width' : 320,
		'params' : {}
	};
</script>
<script type="text/javascript" src="//www.highperformanceformat.com/0d73d6b662ce5f6514511d545d49e26f/invoke.js"></script>
                        </div>

                        <div class="mb-3">
                            <label for="inputValue" class="form-label">Enter Value:</label>
                            <input type="number" class="form-control" id="inputValue" placeholder="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label for="inputUnit" class="form-label">From Unit:</label>
                            <select class="form-select" id="inputUnit">
                                <option value="degrees">Degrees (°)</option>
                                <option value="radians">Radians (rad)</option>
                                <option value="gradians">Gradians (grad)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="outputUnit" class="form-label">To Unit:</label>
                            <select class="form-select" id="outputUnit">
                                <option value="degrees">Degrees (°)</option>
                                <option value="radians">Radians (rad)</option>
                                <option value="gradians">Gradians (grad)</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="convertBtn">Convert</button>
                        </div>
                        <div class="mt-4 p-3 bg-light border rounded">
                            <h5 class="mb-0">Result: <span id="resultValue">0</span></h5>
                        </div>

                        <!-- Ad Section Placeholder (Middle of Tool) -->
                        <div class="ad-placeholder mt-4">
                            <p>Advertisement Area (Tool Page Middle)</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
