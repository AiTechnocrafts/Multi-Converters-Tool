<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Volume Converter - Convert between various units of volume like liters, gallons, cubic meters, etc.">
    <meta name="keywords" content="volume converter, unit converter, liters, gallons, cubic meters, conversion tool">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Volume Converter - Multi-Tools Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Volume Converter</h1>
                        
                        <!-- Ad Section Placeholder (Top of Tool) -->
                        <div class="ad-placeholder mb-4">
                            <p>Advertisement Area (Tool Page Top)</p>
                            <!-- AdSense Code or other ad network code will go here -->
                        </div>

                        <div class="mb-3">
                            <label for="inputValue" class="form-label">Enter Value:</label>
                            <input type="number" class="form-control" id="inputValue" placeholder="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label for="inputUnit" class="form-label">From Unit:</label>
                            <select class="form-select" id="inputUnit">
                                <option value="liters">Liters</option>
                                <option value="milliliters">Milliliters</option>
                                <option value="cubic_meters">Cubic Meters</option>
                                <option value="cubic_centimeters">Cubic Centimeters</option>
                                <option value="cubic_feet">Cubic Feet</option>
                                <option value="cubic_inches">Cubic Inches</option>
                                <option value="gallons_us">Gallons (US Liquid)</option>
                                <option value="quarts_us">Quarts (US Liquid)</option>
                                <option value="pints_us">Pints (US Liquid)</option>
                                <option value="cups_us">Cups (US Liquid)</option>
                                <option value="fluid_ounces_us">Fluid Ounces (US)</option>
                                <option value="gallons_uk">Gallons (UK Imperial)</option>
                                <option value="quarts_uk">Quarts (UK Imperial)</option>
                                <option value="pints_uk">Pints (UK Imperial)</option>
                                <option value="fluid_ounces_uk">Fluid Ounces (UK)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="outputUnit" class="form-label">To Unit:</label>
                            <select class="form-select" id="outputUnit">
                                <option value="liters">Liters</option>
                                <option value="milliliters">Milliliters</option>
                                <option value="cubic_meters">Cubic Meters</option>
                                <option value="cubic_centimeters">Cubic Centimeters</option>
                                <option value="cubic_feet">Cubic Feet</option>
                                <option value="cubic_inches">Cubic Inches</option>
                                <option value="gallons_us">Gallons (US Liquid)</option>
                                <option value="quarts_us">Quarts (US Liquid)</option>
                                <option value="pints_us">Pints (US Liquid)</option>
                                <option value="cups_us">Cups (US Liquid)</option>
                                <option value="fluid_ounces_us">Fluid Ounces (US)</option>
                                <option value="gallons_uk">Gallons (UK Imperial)</option>
                                <option value="quarts_uk">Quarts (UK Imperial)</option>
                                <option value="pints_uk">Pints (UK Imperial)</option>
                                <option value="fluid_ounces_uk">Fluid Ounces (UK)</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="convertBtn">Convert</button>
                        </div>
                        <div class="mt-4 p-3 bg-light border rounded">
                            <h5 class="mb-0">Result: <span id="resultValue">0</span></h5>
                        </div>

                        <!-- Ad Section Placeholder (Middle of Tool) -->
                        <div class="ad-placeholder mt-4">
                            <p>Advertisement Area (Tool Page Middle)</p>
                            <!-- AdSense Code or other ad network code will go here -->
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Header/Footer Inclusion -->
    <script src="../js/header-footer.js"></script>
    <!-- Custom JS for Tool Functionality -->
    <script src="../js/volume-converter.js"></script>
</body>
</html>
