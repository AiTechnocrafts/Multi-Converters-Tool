<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fuel Efficiency Converter - Convert between MPG, L/100km, km/L, etc.">
    <meta name="keywords" content="fuel efficiency converter, unit converter, mpg, l/100km, km/l, conversion tool">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Fuel Efficiency Converter - Multi-Converters-Tool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="tool-card p-4">
                    <div class="icon"><i class="fas fa-gas-pump"></i></div>
                    <h1 class="h3 mb-4">Fuel Efficiency Converter</h1>
                    
                    <div class="ad-space" style="padding: 20px;">
                        <p>Advertisement Area</p>
                    </div>

                    <div class="mb-3">
                        <label for="inputValue" class="form-label">Enter Value:</label>
                        <input type="number" class="form-control" id="inputValue" placeholder="0" value="0">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="inputUnit" class="form-label">From Unit:</label>
                            <select class="form-select" id="inputUnit">
                                <option value="mpg_us">Miles per Gallon (US)</option>
                                <option value="mpg_uk">Miles per Gallon (UK)</option>
                                <option value="l_100km">Liters per 100 km</option>
                                <option value="km_l">Kilometers per Liter</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="outputUnit" class="form-label">To Unit:</label>
                            <select class="form-select" id="outputUnit">
                                <option value="mpg_us">Miles per Gallon (US)</option>
                                <option value="mpg_uk">Miles per Gallon (UK)</option>
                                <option value="l_100km">Liters per 100 km</option>
                                <option value="km_l">Kilometers per Liter</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3 p-3 bg-light border rounded text-center">
                        <h5 class="mb-0">Result: <span id="resultValue" class="fw-bold">0</span></h5>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Header/Footer Inclusion -->
    <script src="../js/header-footer.js"></script>
    <!-- Custom JS for Tool Functionality -->
    <script src="../js/fuel-efficiency-converter.js"></script>
</body>
</html>
