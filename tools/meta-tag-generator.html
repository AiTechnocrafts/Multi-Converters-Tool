<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate essential HTML meta tags for your website to improve SEO.">
    <meta name="keywords" content="meta tag generator, seo tools, meta title, meta description, meta keywords, author, viewport">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Meta Tag Generator - Multi-Converters-Tool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="tool-card p-4">
                    <div class="icon"><i class="fas fa-tags"></i></div>
                    <h1 class="h3 mb-4">Meta Tag Generator</h1>
                    
                    <div class="ad-space" style="padding: 20px;">
                        <p>Advertisement Area</p>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label">Title:</label>
                        <input type="text" class="form-control" id="title" placeholder="Your Page Title">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description:</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="A brief description of your page."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="keywords" class="form-label">Keywords (comma-separated):</label>
                        <input type="text" class="form-control" id="keywords" placeholder="keyword1, keyword2, keyword3">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label">Author:</label>
                        <input type="text" class="form-control" id="author" placeholder="Your Name or Company">
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" id="generateBtn">Generate Meta Tags</button>
                    </div>

                    <div class="mt-4">
                        <label for="metaOutput" class="form-label">Generated Meta Tags:</label>
                        <textarea class="form-control" id="metaOutput" rows="8" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Header/Footer Inclusion -->
    <script src="../js/header-footer.js"></script>
    <!-- Custom JS for Tool Functionality -->
    <script src="../js/meta-tag-generator.js"></script>
</body>
</html>
