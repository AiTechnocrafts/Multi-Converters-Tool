<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate an XML sitemap for your website to help search engines index your pages.">
    <meta name="keywords" content="sitemap generator, xml sitemap, seo tools, search engine optimization, index pages">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Sitemap Generator - Multi-Tools Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">XML Sitemap Generator</h1>
                        
                        <!-- Ad Section Placeholder (Top of Tool) -->
                        <div class="ad-placeholder mb-4">
                            <p><script type="text/javascript">
	atOptions = {
		'key' : '0d73d6b662ce5f6514511d545d49e26f',
		'format' : 'iframe',
		'height' : 50,
		'width' : 320,
		'params' : {}
	};
</script>
<script type="text/javascript" src="//www.highperformanceformat.com/0d73d6b662ce5f6514511d545d49e26f/invoke.js"></script></p>
                        </div>

                        <div class="mb-3">
                            <label for="baseUrl" class="form-label">Base URL of your website:</label>
                            <input type="url" class="form-control" id="baseUrl" placeholder="https://www.example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="urls" class="form-label">Additional URLs (one per line):</label>
                            <textarea class="form-control" id="urls" rows="6" placeholder="/about.html&#x0a;/contact.html&#x0a;/tools/my-new-tool.html"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="generateBtn">Generate Sitemap</button>
                        </div>

                        <div class="mt-4">
                            <label for="sitemapOutput" class="form-label">Generated Sitemap.xml:</label>
                            <textarea class="form-control" id="sitemapOutput" rows="12" readonly></textarea>
                        </div>

                        <!-- Ad Section Placeholder (Middle of Tool) -->
                        <div class="ad-placeholder mt-4">
                            <p>Advertisement Area (Tool Page Middle)</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Header/Footer Inclusion -->
    <script src="../js/header-footer.js"></script>
    <!-- Custom JS for Tool Functionality -->
    <script src="../js/sitemap-generator.js"></script>
</body>
</html>
