<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate a robots.txt file for your website to control web crawler access.">
    <meta name="keywords" content="robots.txt generator, seo tools, web crawler, user-agent, disallow, allow, sitemap">
    <meta name="author" content="Aitechnocraftschatbot">
    <title>Robots.txt Generator - Multi-Tools Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
    <!-- Header will be dynamically loaded here -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Robots.txt Generator</h1>
                        
                        <!-- Ad Section Placeholder (Top of Tool) -->
                        <div class="ad-placeholder mb-4">
                            <p>Advertisement Area (Tool Page Top)</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Default for all crawlers:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="defaultAccess" id="allowAll" value="allow" checked>
                                <label class="form-check-label" for="allowAll">Allow All</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="defaultAccess" id="disallowAll" value="disallow">
                                <label class="form-check-label" for="disallowAll">Disallow All</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="sitemapUrl" class="form-label">Sitemap URL (optional):</label>
                            <input type="url" class="form-control" id="sitemapUrl" placeholder="https://www.example.com/sitemap.xml">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Restricted Directories (one per line):</label>
                            <textarea class="form-control" id="restrictedDirs" rows="4" placeholder="/admin/&#x0a;/private/"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="generateBtn">Generate Robots.txt</button>
                        </div>

                        <div class="mt-4">
                            <label for="robotsOutput" class="form-label">Generated Robots.txt:</label>
                            <textarea class="form-control" id="robotsOutput" rows="10" readonly></textarea>
                        </div>

                        <!-- Ad Section Placeholder (Middle of Tool) -->
                        <div class="ad-placeholder mt-4">
                            <p>Advertisement Area (Tool Page Middle)</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded here -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Header/Footer Inclusion -->
    <script src="../js/header-footer.js"></script>
    <!-- Custom JS for Tool Functionality -->
    <script src="../js/robots-txt-generator.js"></script>
</body>
</html>
